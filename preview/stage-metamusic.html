<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舞台模式 · MetaMusic 風格預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand-blue:#0066cc;
  --deep-indigo:#0e2575;
  --midnight-card:#213680;
  --charcoal-ink:#101820;
  --paper-cream:#f4f1ea;
  --white:#ffffff;
  --lavender-mist:#e6e0f8;
  --ice-blue:#e9f4ff;
  --peach-blush:#f7e1d5;
  --ash-border:#d6d6d6;

  --font:'Inter',ui-sans-serif,system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  --radius-cards:24px;
  --radius-pill:9999px;
  --shadow-subtle: rgb(0,0,0) 0px 4px 0px 0px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;display:flex;flex-direction:column;
  background:var(--paper-cream);color:var(--charcoal-ink);
  font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}

/* ---------- top bar ---------- */
.top{
  flex:none;height:64px;background:var(--white);
  border-bottom:1px solid var(--ash-border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;gap:16px;
}
.top .left{display:flex;align-items:center;gap:12px;min-width:0;}
.mark{
  width:26px;height:26px;border-radius:8px;background:var(--brand-blue);
  display:grid;place-items:center;flex:none;
}
.mark span{width:9px;height:9px;border-radius:50%;border:2px solid var(--white);}
.top .ctx{
  font-size:14px;line-height:1.5;color:var(--charcoal-ink);opacity:.65;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.top .right{display:flex;align-items:center;gap:12px;flex:none;}

.btn{
  border-radius:var(--radius-pill);border:1px solid var(--charcoal-ink);
  background:var(--white);color:var(--charcoal-ink);
  font-family:var(--font);font-size:16px;font-weight:500;
  padding:12px 24px;cursor:pointer;white-space:nowrap;
  box-shadow:var(--shadow-subtle);
  transition:transform .1s ease, box-shadow .1s ease;
}
.btn:active{transform:translateY(4px);box-shadow:none;}
.btn-sm{font-size:14px;padding:10px 18px;}
.btn-blue{background:var(--brand-blue);border-color:var(--brand-blue);color:var(--white);}

@media(max-width:700px){
  .top{height:56px;padding:0 16px;gap:8px;}
  .top .ctx{display:none;}
  .btn-sm{font-size:13px;padding:8px 14px;}
}

/* ---------- stage body ---------- */
.stage{flex:1;min-height:0;display:flex;overflow:hidden;padding:24px 32px 0;gap:24px;}
@media(max-width:900px){.stage{padding:12px 12px 0;gap:0;}}

/* lyrics card — 24px radius, 40px padding, white */
.sheet{
  flex:1;min-width:0;overflow-y:auto;
  background:var(--white);border-radius:var(--radius-cards);
  padding:40px;
  margin-bottom:24px;
  display:flex;flex-direction:column;
}
@media(max-width:700px){.sheet{padding:24px;border-radius:16px;margin-bottom:12px;}}

.song-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:24px;padding-bottom:24px;border-bottom:1px solid var(--ash-border);
  margin-bottom:32px;
}
.song-head .txt{min-width:0;}
h1.song-title{
  margin:0;
  font-size:40px;line-height:1.1;font-weight:600;letter-spacing:-0.4px;
  overflow:hidden;text-overflow:ellipsis;
}
@media(max-width:900px){
  h1.song-title{font-size:32px;line-height:1.2;letter-spacing:-0.32px;white-space:nowrap;}
}
@media(max-width:700px){
  h1.song-title{font-size:22px;line-height:1.2;letter-spacing:-0.2px;}
  .song-head{
    gap:12px;padding-bottom:16px;margin-bottom:20px;
    /* Stack on phones: side-by-side forced the subtitle to wrap under a
       keygroup that cannot shrink. */
    flex-direction:column;align-items:flex-start;
  }
  .song-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .keygroup{align-self:flex-start;}
}
.song-sub{margin:8px 0 0;font-size:14px;line-height:1.5;opacity:.6;}

/* key + transpose */
.keygroup{display:flex;align-items:center;gap:8px;flex:none;}
.key{
  border-radius:var(--radius-pill);background:var(--brand-blue);color:var(--white);
  padding:6px 16px;font-size:19px;font-weight:500;line-height:1.4;
  font-variant-numeric:tabular-nums;
}
.key-orig{font-size:14px;line-height:1.5;opacity:.55;}
.stepper{
  display:flex;align-items:center;border-radius:var(--radius-pill);
  border:1px solid var(--charcoal-ink);background:var(--white);
  box-shadow:var(--shadow-subtle);overflow:hidden;
}
.stepper button{
  width:32px;height:32px;border:0;background:none;color:var(--charcoal-ink);
  font-size:16px;font-weight:500;cursor:pointer;line-height:1;
}
.stepper button:hover{background:var(--ice-blue);}
.stepper .val{
  min-width:30px;text-align:center;font-size:14px;font-weight:500;
  font-variant-numeric:tabular-nums;
}
@media(max-width:700px){
  .key{font-size:14px;padding:3px 12px;}
  .key-orig{display:none;}
  .stepper button{width:28px;height:28px;font-size:14px;}
}

/* ---------- lyrics ---------- */
.sec-label{
  display:inline-block;align-self:flex-start;margin:32px 0 12px;
  border-radius:var(--radius-pill);background:var(--lavender-mist);
  padding:4px 16px;font-size:14px;font-weight:500;line-height:1.5;
}
.sec-label:first-of-type{margin-top:0;}

.chord-line{
  display:flex;flex-wrap:wrap;align-items:flex-end;
  font-size:19px;line-height:1.4;
}
.chord-line .ch{
  color:var(--brand-blue);font-weight:500;font-size:16px;
  margin-right:3px;
}
.chord-line .tx{padding-right:3px;}
.plain{margin:0;font-size:19px;line-height:1.4;}

/* ---------- metrics rail ---------- */
.rail{
  width:300px;flex:none;overflow-y:auto;
  display:flex;flex-direction:column;gap:24px;
  margin-bottom:24px;
  /* min-height:0 lets a flex child actually scroll instead of overflowing. */
  min-height:0;
}
@media(max-width:900px){.rail{display:none;}}

/* indigo panel card, per the dark-section treatment */
.panel{
  background:var(--deep-indigo);color:var(--white);
  border-radius:var(--radius-cards);padding:40px;
}
@media(max-width:1100px){.panel{padding:24px;}}
.panel .n{
  width:32px;height:32px;border-radius:50%;background:var(--brand-blue);
  display:grid;place-items:center;font-size:14px;font-weight:500;
}
.panel h3{
  margin:24px 0 0;font-size:22px;font-weight:500;line-height:1.2;letter-spacing:-0.2px;
}
.panel .flow{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;}
.panel .chip{
  border-radius:var(--radius-pill);padding:4px 14px;
  font-size:14px;font-weight:500;line-height:1.5;
  border:1px solid rgba(255,255,255,.4);color:var(--white);
}
.panel .chip.now{background:var(--brand-blue);border-color:var(--brand-blue);}

.kv{display:flex;justify-content:space-between;gap:12px;font-size:16px;line-height:1.4;}
.kv span:first-child{opacity:.7;}
.kv span:last-child{font-weight:500;}

/* peach illustration circle — the system's only warm accent */
.note{
  background:var(--white);border-radius:var(--radius-cards);padding:24px;
  display:flex;gap:16px;align-items:flex-start;
}
.note .circle{
  width:48px;height:48px;border-radius:50%;background:var(--peach-blush);
  display:grid;place-items:center;flex:none;
}
.note .circle span{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand-blue);}
.note p{margin:0;font-size:16px;line-height:1.4;}

/* ---------- bottom bar ---------- */
.bottom{
  flex:none;background:var(--white);border-top:1px solid var(--ash-border);
  display:flex;align-items:center;gap:12px;
  padding:12px 24px calc(12px + env(safe-area-inset-bottom));
}
.nav-arrow{
  width:40px;height:40px;border-radius:50%;background:#000;color:#fff;border:0;
  display:grid;place-items:center;font-size:15px;cursor:pointer;flex:none;
}
.nav-arrow:disabled{opacity:.3;cursor:default;}

.now{flex:1;min-width:0;text-align:center;}
.now .t{
  margin:0;font-size:19px;line-height:1.4;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.now .t .k{
  border-radius:var(--radius-pill);background:var(--brand-blue);color:#fff;
  font-size:12px;font-weight:500;line-height:1.5;padding:1px 10px;flex:none;
}
.now .s{margin:2px 0 0;font-size:12px;line-height:1.5;opacity:.55;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.tools{display:flex;gap:8px;flex:none;}
.tool{
  height:36px;min-width:36px;padding:0 12px;border-radius:var(--radius-pill);
  border:1px solid var(--charcoal-ink);background:var(--white);
  color:var(--charcoal-ink);font-size:14px;font-weight:500;
  display:grid;place-items:center;cursor:pointer;
  box-shadow:var(--shadow-subtle);
  transition:transform .1s ease, box-shadow .1s ease;
}
.tool:active{transform:translateY(4px);box-shadow:none;}

@media(max-width:700px){
  .bottom{padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px;}
  .now .t{font-size:16px;}
  .tools .tool:nth-child(2),
  .tools .tool:nth-child(3){display:none;}
}
</style>
</head>
<body>

<header class="top">
  <div class="left">
    <span class="mark"><span></span></span>
    <span class="ctx">20261114 青少年聚會 · 3 首</span>
  </div>
  <div class="right">
    <button class="btn btn-sm">詩歌順序</button>
    <button class="btn btn-sm btn-blue">結束舞台</button>
  </div>
</header>

<main class="stage">

  <!-- lyrics sheet -->
  <article class="sheet">
    <div class="song-head">
      <div class="txt">
        <h1 class="song-title">我們高舉耶穌的名</h1>
        <p class="song-sub">20261114 青少年聚會 · 第 1 首</p>
      </div>
      <div class="keygroup">
        <span class="key">C</span>
        <span class="key-orig">原 D</span>
        <div class="stepper">
          <button aria-label="降半音">−</button>
          <span class="val">−2</span>
          <button aria-label="升半音">+</button>
        </div>
      </div>
    </div>

    <span class="sec-label">Verse 1</span>
    <p class="plain">我們高舉耶穌的名</p>
    <div class="chord-line">
      <span class="ch">C</span><span class="tx">高舉</span>
      <span class="ch">G</span><span class="tx">全能</span>
      <span class="ch">Am</span><span class="tx">君王</span>
    </div>
    <div class="chord-line">
      <span class="ch">F</span><span class="tx">祢配得一切讚美</span>
    </div>

    <span class="sec-label">Chorus</span>
    <div class="chord-line">
      <span class="ch">C</span><span class="tx">耶穌</span>
      <span class="ch">G</span><span class="tx">祢的名</span>
      <span class="ch">Am</span><span class="tx">何等</span>
      <span class="ch">F</span><span class="tx">甜美</span>
    </div>
    <div class="chord-line">
      <span class="ch">C</span><span class="tx">超過一切</span>
      <span class="ch">G</span><span class="tx">名號</span>
    </div>

    <span class="sec-label">Bridge</span>
    <p class="plain">萬膝要跪拜　萬口要承認</p>
    <div class="chord-line">
      <span class="ch">Am</span><span class="tx">萬膝</span>
      <span class="ch">F</span><span class="tx">要跪拜</span>
      <span class="ch">C</span><span class="tx">萬口</span>
      <span class="ch">G</span><span class="tx">要承認</span>
    </div>
  </article>

  <!-- metrics rail -->
  <aside class="rail">
    <div class="panel">
      <span class="n">1</span>
      <h3>段落 Flow</h3>
      <div class="flow">
        <span class="chip">V1</span>
        <span class="chip now">C</span>
        <span class="chip">C</span>
        <span class="chip">Bridge</span>
      </div>
    </div>

    <div class="panel">
      <span class="n">2</span>
      <h3>速度與動態</h3>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px;">
        <div class="kv"><span>速度</span><span>72 bpm</span></div>
        <div class="kv"><span>拍號</span><span>4/4</span></div>
        <div class="kv"><span>動態</span><span>7 / 10</span></div>
        <div class="kv"><span>接</span><span>Pad 鋪底</span></div>
      </div>
    </div>

    <div class="note">
      <span class="circle"><span></span></span>
      <p>注意：第二次副歌收細聲。</p>
    </div>
  </aside>

</main>

<footer class="bottom">
  <button class="nav-arrow" aria-label="上一首">‹</button>
  <div class="now">
    <p class="t"><span>我們高舉耶穌的名</span><span class="k">C</span></p>
    <p class="s">1 / 3 · 注意：第二次副歌收細聲</p>
  </div>
  <button class="nav-arrow" aria-label="下一首">›</button>
  <div class="tools">
    <button class="tool" aria-label="切換和弦" title="隱藏和弦">和弦</button>
    <button class="tool" aria-label="全螢幕">全螢幕</button>
    <button class="tool" aria-label="深色">深色</button>
  </div>
</footer>

</body>
</html>

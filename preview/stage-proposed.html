<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舞台模式 · 建議版</title>
<style>
/* Same real tokens as the live app, plus the three proposal tokens:
   --live (warm, distinct from blue), --hover and --field (split from --soft). */
:root{
  --bg:#f4f1ea; --card:#ffffff; --soft:#e9f4ff; --fg:#101820;
  --muted-fg:#6d7378; --border:#d6d6d6; --accent:#0066cc;
  --accent-soft:#dbeafe;
  --live:#c2410c;
  --live-soft:#fde8dc;
  --hover:#eef4fb;
  --field:#f7f6f2;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;display:flex;flex-direction:column;
  background:var(--bg);color:var(--fg);
  font-family:"PingFang TC","Noto Sans TC",-apple-system,sans-serif;
  font-size:14px;line-height:1.45;overflow:hidden;
}

/* ---------- stage top bar ---------- */
.top{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:10px 16px;
}
.top .left{display:flex;align-items:center;gap:8px;min-width:0;}
.mark{width:20px;height:20px;border-radius:5px;background:var(--accent);display:grid;place-items:center;flex:none;}
.mark i{width:7px;height:7px;border-radius:50%;border:1.5px solid #fff;display:block;}
.ctx{font-size:12px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-actions{display:flex;gap:6px;flex:none;}
.iconbtn{
  width:32px;height:32px;border-radius:9999px;border:1px solid var(--border);
  background:var(--card);color:var(--muted-fg);display:grid;place-items:center;
  font-size:13px;cursor:pointer;
}
.iconbtn:hover{background:var(--hover);}

/* ---------- body ---------- */
.stage{flex:1;min-height:0;display:flex;gap:12px;padding:0 16px 12px;overflow:hidden;}
@media(max-width:900px){.stage{padding:0 8px 8px;gap:0;}}

/* lyrics panel */
.sheet{
  flex:1;min-width:0;background:var(--card);border-radius:24px;
  display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--border);
}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:20px 24px 32px;}
@media(max-width:700px){.scroll{padding:14px 14px 24px;}}

/* song header */
.song-head{
  display:flex;align-items:center;gap:12px;
  padding-bottom:14px;margin-bottom:20px;border-bottom:1px solid var(--border);
}
h1.song-title{
  margin:0;flex:1;min-width:0;
  font-size:22px;font-weight:600;letter-spacing:-.3px;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
@media(min-width:1000px){h1.song-title{font-size:28px;letter-spacing:-.5px;}}

/* SUGGESTION 2 applied to stage: the key + stepper is the only filled
   blue control here, because it is the one thing a player changes live. */
.keygroup{display:flex;align-items:center;gap:6px;flex:none;}
.key{
  background:var(--accent);color:#fff;border-radius:9999px;
  padding:4px 14px;font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.orig{font-size:11px;color:var(--muted-fg);}
.stepper{
  display:flex;align-items:center;border:1px solid var(--border);
  border-radius:9999px;overflow:hidden;background:var(--card);
}
.stepper button{
  width:30px;height:30px;border:0;background:none;color:var(--fg);
  font-size:15px;cursor:pointer;line-height:1;
}
.stepper button:hover{background:var(--hover);}
.stepper .val{
  min-width:26px;text-align:center;font-size:12px;font-weight:500;
  font-variant-numeric:tabular-nums;
}

/* lyrics */
.sec{
  display:inline-block;margin:22px 0 8px;
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted-fg);
}
.sec:first-of-type{margin-top:0;}
.plain{margin:0 0 4px;font-size:17px;line-height:1.6;}
.chord-line{display:flex;flex-wrap:wrap;align-items:flex-end;font-size:17px;line-height:1.6;}
.chord-line .ch{color:var(--accent);font-weight:600;font-size:14px;margin-right:3px;}
.chord-line .tx{padding-right:3px;}

/* ---------- right rail ---------- */
.rail{
  width:250px;flex:none;min-height:0;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;
}
@media(max-width:900px){.rail{display:none;}}

.panel{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:14px;}
.panel h3{
  margin:0 0 10px;font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);
}

/* SUGGESTION 1 on stage: the active flow chip is blue (a choice), and the
   currently-playing state lives in the banner below, in the live hue. */
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{
  border-radius:9999px;padding:3px 10px;font-size:11px;
  border:1px solid var(--border);background:var(--card);color:var(--muted-fg);
  flex:0 0 auto;
}
.chip.now{
  background:var(--accent-soft);color:var(--accent);font-weight:500;
  border-color:color-mix(in srgb,var(--accent) 35%, transparent);
}

.kv{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:13px;}
.kv span:first-child{color:var(--muted-fg);}
.kv span:last-child{font-weight:500;}

/* dynamic meter */
.meter{height:5px;border-radius:9999px;background:var(--border);overflow:hidden;margin-top:8px;}
.meter i{display:block;height:100%;background:var(--accent);border-radius:9999px;}

.livebox{
  background:var(--live-soft);border:1px solid color-mix(in srgb,var(--live) 30%, transparent);
  border-radius:24px;padding:12px;display:flex;gap:8px;align-items:flex-start;
}
.livebox .ring{
  width:8px;height:8px;border-radius:50%;background:var(--live);flex:none;margin-top:5px;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--live) 22%, transparent);
}
.livebox p{margin:0;font-size:12.5px;line-height:1.5;color:var(--live);font-weight:500;}

.note{
  background:var(--card);border:1px solid var(--border);border-radius:24px;
  padding:14px;font-size:12.5px;line-height:1.5;color:var(--muted-fg);
}
.note b{color:var(--fg);font-weight:600;}

/* ---------- bottom bar ---------- */
.bottom{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:var(--card);
}
.nav-arrow{
  width:40px;height:40px;border-radius:9999px;border:1px solid var(--border);
  background:var(--card);color:var(--fg);display:grid;place-items:center;
  font-size:16px;cursor:pointer;flex:none;
}
.nav-arrow:hover{background:var(--hover);}
.nav-arrow:disabled{opacity:.35;cursor:default;}

.now{flex:1;min-width:0;text-align:center;}
.now .t{
  margin:0;font-size:14px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.now .t .k{
  background:var(--accent-soft);color:var(--accent);
  border-radius:9999px;font-size:11px;font-weight:500;
  padding:1px 8px;flex:none;
}
.now .s{
  margin:2px 0 0;font-size:11px;color:var(--muted-fg);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tools{display:flex;gap:6px;flex:none;}

@media(max-width:700px){
  .top{padding:8px 10px;}
  .ctx{display:none;}
  .bottom{padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px;}
  .now .s{display:none;}
  .tools .iconbtn:nth-child(n+3){display:none;}
  h1.song-title{font-size:18px;}
  .key{padding:3px 11px;font-size:13px;}
  .orig{display:none;}
}
</style>
</head>
<body>

<header class="top">
  <div class="left">
    <span class="mark"><i></i></span>
    <span class="ctx">20261114 青少年聚會 · 第 1 首，共 3 首</span>
  </div>
  <div class="top-actions">
    <button class="iconbtn" aria-label="詩歌順序">☰</button>
    <button class="iconbtn" aria-label="結束舞台">✕</button>
  </div>
</header>

<main class="stage">

  <section class="sheet">
    <div class="scroll">

      <div class="song-head">
        <h1 class="song-title">我們高舉耶穌的名</h1>
        <div class="keygroup">
          <span class="key">C</span>
          <span class="orig">原 D</span>
          <div class="stepper">
            <button aria-label="降半音">−</button>
            <span class="val">−2</span>
            <button aria-label="升半音">+</button>
          </div>
        </div>
      </div>

      <span class="sec">Verse 1</span>
      <p class="plain">我們高舉耶穌的名</p>
      <div class="chord-line">
        <span class="ch">C</span><span class="tx">高舉</span>
        <span class="ch">G</span><span class="tx">全能</span>
        <span class="ch">Am</span><span class="tx">君王</span>
      </div>
      <div class="chord-line">
        <span class="ch">F</span><span class="tx">祢配得一切讚美</span>
      </div>

      <span class="sec">Chorus</span>
      <div class="chord-line">
        <span class="ch">C</span><span class="tx">耶穌</span>
        <span class="ch">G</span><span class="tx">祢的名</span>
        <span class="ch">Am</span><span class="tx">何等</span>
        <span class="ch">F</span><span class="tx">甜美</span>
      </div>
      <div class="chord-line">
        <span class="ch">C</span><span class="tx">超過一切</span>
        <span class="ch">G</span><span class="tx">名號</span>
      </div>

      <span class="sec">Bridge</span>
      <p class="plain">萬膝要跪拜　萬口要承認</p>
      <div class="chord-line">
        <span class="ch">Am</span><span class="tx">萬膝</span>
        <span class="ch">F</span><span class="tx">要跪拜</span>
        <span class="ch">C</span><span class="tx">萬口</span>
        <span class="ch">G</span><span class="tx">要承認</span>
      </div>

    </div>
  </section>

  <aside class="rail">
    <div class="panel">
      <h3>段落 Flow</h3>
      <div class="chips">
        <span class="chip">V1</span>
        <span class="chip now">C</span>
        <span class="chip">C</span>
        <span class="chip">Bridge</span>
      </div>
    </div>

    <div class="panel">
      <h3>動態 7 / 10</h3>
      <div class="meter"><i style="width:70%"></i></div>
    </div>

    <div class="panel">
      <h3>資料</h3>
      <div class="kv"><span>速度</span><span>72 bpm</span></div>
      <div class="kv"><span>拍號</span><span>4/4</span></div>
      <div class="kv"><span>接歌</span><span>Pad 鋪底</span></div>
    </div>

    <div class="livebox">
      <span class="ring"></span>
      <p>由 iPad KWL 推送<br><span style="font-weight:400;opacity:.85;">昨天 15:42</span></p>
    </div>

    <div class="note"><b>注意：</b>第二次副歌收細聲。</div>
  </aside>

</main>

<footer class="bottom">
  <button class="nav-arrow" aria-label="上一首">‹</button>
  <div class="now">
    <p class="t"><span>我們高舉耶穌的名</span><span class="k">C</span></p>
    <p class="s">1 / 3 · 注意：第二次副歌收細聲</p>
  </div>
  <button class="nav-arrow" aria-label="下一首">›</button>
  <div class="tools">
    <button class="iconbtn" aria-label="切換和弦">👁</button>
    <button class="iconbtn" aria-label="全螢幕">⤢</button>
    <button class="iconbtn" aria-label="深色">☾</button>
  </div>
</footer>

</body>
</html>

<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舞台模式 · Desktop.fm 風格預覽</title>
<style>
:root{
  --canvas-mist:#f1f2f3;
  --carbon-black:#111111;
  --pure-white:#ffffff;
  --graphite:#2d2d2d;
  --pale-stone:#dddddd;
  --silver-mist:#b4b4b4;

  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,"PingFang TC","Noto Sans TC",sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;

  --r-card:25px;
  --r-btn:20px;
  --r-win:13px;
  --r-flat:1.5px;
  --shadow-window: 0 1px 3px rgba(17,17,17,.08), 0 4px 12px rgba(17,17,17,.06);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;display:flex;flex-direction:column;
  background:var(--canvas-mist);color:var(--carbon-black);
  font-family:var(--font);line-height:1.25;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}

/* ---------- top bar: minimal chrome ---------- */
.top{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:10px 20px;
}
.top .left{display:flex;align-items:center;gap:8px;min-width:0;}
.dots{display:flex;gap:5px;flex:none;}
.dots i{width:6px;height:6px;border-radius:var(--r-flat);background:var(--silver-mist);display:block;}
.dots i.mid,.dots i.last{background:var(--graphite);}
.ctx{
  font-family:var(--mono);font-size:12px;font-weight:800;color:var(--silver-mist);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.top .right{display:flex;gap:8px;flex:none;}

/* the one filled CTA */
.cta{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--carbon-black);color:var(--pure-white);
  border:0;border-radius:var(--r-btn);padding:10px 20px;
  font-family:var(--font);font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;
}
.ghost{
  background:transparent;border:1.5px solid var(--pale-stone);color:var(--graphite);
  border-radius:var(--r-btn);padding:8px 14px;
  font-family:var(--font);font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;
}

/* ---------- body ---------- */
.stage{
  flex:1;min-height:0;display:flex;gap:20px;
  padding:0 20px 20px;overflow:hidden;
}
@media(max-width:900px){.stage{padding:0 10px 10px;gap:0;}}

/* lyrics sheet — the window card, 25px radius */
.sheet{
  flex:1;min-width:0;display:flex;flex-direction:column;
  background:var(--pure-white);border-radius:var(--r-card);
  box-shadow:var(--shadow-window);
  overflow:hidden;
}
.sheet-bar{
  flex:none;display:flex;align-items:center;gap:8px;
  padding:10px 16px;border-bottom:2px solid var(--pale-stone);
}
.sheet-bar .name{
  margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:800;color:var(--silver-mist);
}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:20px 24px 32px;}
@media(max-width:700px){.sheet-body{padding:14px 14px 24px;}}

/* song header */
.song-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;padding-bottom:14px;margin-bottom:20px;
  border-bottom:1.5px solid var(--pale-stone);
}
h1.song-title{
  margin:0;min-width:0;
  font-size:28px;font-weight:800;line-height:1.25;letter-spacing:-1.008px;
  overflow:hidden;text-overflow:ellipsis;
}
@media(max-width:700px){
  h1.song-title{font-size:20px;letter-spacing:-0.6px;white-space:nowrap;}
  .song-head{flex-direction:column;gap:10px;}
}
.song-kv{
  margin:6px 0 0;font-family:var(--mono);font-size:12px;font-weight:800;color:var(--silver-mist);
}

/* key + transpose */
.keygroup{display:flex;align-items:center;gap:6px;flex:none;}
.key{
  background:var(--carbon-black);color:var(--pure-white);
  border-radius:var(--r-flat);padding:3px 9px;
  font-family:var(--mono);font-size:16px;font-weight:800;
}
.orig{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--silver-mist);}
.stepper{
  display:flex;align-items:center;gap:0;
  border:1.5px solid var(--pale-stone);border-radius:var(--r-btn);overflow:hidden;
}
.stepper button{
  width:26px;height:26px;border:0;background:none;color:var(--graphite);
  font-size:14px;font-weight:800;cursor:pointer;line-height:1;
}
.stepper button:hover{background:var(--canvas-mist);}
.stepper .val{
  min-width:24px;text-align:center;font-family:var(--mono);
  font-size:12px;font-weight:800;color:var(--carbon-black);
}

/* lyrics */
.sec{
  display:inline-block;margin:22px 0 8px;
  font-family:var(--mono);font-size:12px;font-weight:800;
  color:var(--silver-mist);letter-spacing:0;text-transform:uppercase;
}
.sec:first-of-type{margin-top:0;}
.plain{margin:0 0 4px;font-size:18px;font-weight:700;letter-spacing:-0.288px;line-height:1.4;}
.chord-line{display:flex;flex-wrap:wrap;align-items:flex-end;font-size:18px;font-weight:500;line-height:1.4;letter-spacing:-0.288px;}
.chord-line .ch{
  font-family:var(--mono);font-size:12px;font-weight:800;
  color:var(--silver-mist);margin-right:4px;
}
.chord-line .tx{padding-right:4px;}

/* ---------- rail ---------- */
.rail{
  width:260px;flex:none;min-height:0;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;
}
@media(max-width:900px){.rail{display:none;}}

.panel{
  background:var(--pure-white);border-radius:var(--r-flat);
  box-shadow:var(--shadow-window);padding:10px 12px;
}
.panel .hd{
  display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:8px;border-bottom:1.5px solid var(--pale-stone);
}
.panel .hd span:first-child{
  font-family:var(--mono);font-size:12px;font-weight:800;
  color:var(--silver-mist);text-transform:uppercase;
}
.panel .hd span:last-child{font-size:16px;font-weight:800;letter-spacing:-0.256px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.chip{
  border:1.5px solid var(--pale-stone);border-radius:var(--r-btn);
  padding:2px 8px;font-family:var(--mono);font-size:12px;font-weight:800;color:var(--graphite);
  flex:0 0 auto; /* hug the label; flex-wrap must not stretch it */
}
.chip.now{background:var(--carbon-black);color:var(--pure-white);border-color:var(--carbon-black);}

.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1.5px solid var(--pale-stone);}
.kv:last-child{border-bottom:0;}
.kv span:first-child{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--silver-mist);}
.kv span:last-child{font-size:16px;font-weight:700;letter-spacing:-0.256px;}

/* dynamic meter: monochrome, no accent colour allowed */
.meter{height:6px;border-radius:var(--r-flat);background:var(--pale-stone);overflow:hidden;margin-top:8px;}
.meter i{display:block;height:100%;background:var(--carbon-black);}

.note{
  background:var(--pure-white);border-radius:var(--r-flat);
  box-shadow:var(--shadow-window);padding:10px 12px;
  font-size:16px;font-weight:500;letter-spacing:-0.256px;color:var(--graphite);
}

/* ---------- bottom bar ---------- */
.bottom{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:10px 20px calc(10px + env(safe-area-inset-bottom));
}
.arrow{
  width:34px;height:34px;border-radius:50%;background:var(--carbon-black);color:#fff;
  border:0;display:grid;place-items:center;font-size:14px;font-weight:800;
  cursor:pointer;flex:none;
}
.arrow:disabled{background:var(--silver-mist);cursor:default;}
.now{flex:1;min-width:0;text-align:center;}
.now .t{
  margin:0;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:16px;font-weight:800;letter-spacing:-0.256px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.now .t .k{
  font-family:var(--mono);font-size:12px;font-weight:800;
  background:var(--carbon-black);color:#fff;border-radius:var(--r-flat);padding:1px 6px;flex:none;
}
.now .s{
  margin:2px 0 0;font-family:var(--mono);font-size:12px;font-weight:800;color:var(--silver-mist);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tools{display:flex;gap:6px;flex:none;}
.tool{
  height:30px;min-width:30px;padding:0 10px;
  border:1.5px solid var(--pale-stone);border-radius:var(--r-btn);
  background:transparent;color:var(--graphite);
  font-family:var(--mono);font-size:12px;font-weight:800;
  display:grid;place-items:center;cursor:pointer;
}
.tool:hover{border-color:var(--graphite);color:var(--carbon-black);}

@media(max-width:700px){
  .top{padding:8px 10px;}
  .ctx{display:none;}
  .bottom{padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px;}
  .now .t{font-size:14px;}
  .tools .tool:nth-child(n+2){display:none;}
}
</style>
</head>
<body>

<header class="top">
  <div class="left">
    <span class="dots"><i></i><i class="mid"></i><i class="last"></i></span>
    <span class="ctx">20261114 青少年聚會 · 01/03</span>
  </div>
  <div class="right">
    <button class="ghost">詩歌順序</button>
    <button class="cta">結束舞台 ›</button>
  </div>
</header>

<main class="stage">

  <section class="sheet">
    <div class="sheet-bar">
      <span class="dots"><i></i><i class="mid"></i><i class="last"></i></span>
      <span class="name">lyrics</span>
    </div>

    <div class="sheet-body">
      <div class="song-head">
        <div style="min-width:0;">
          <h1 class="song-title">我們高舉耶穌的名</h1>
          <p class="song-kv">C KEY · 72 BPM · 4/4</p>
        </div>
        <div class="keygroup">
          <span class="key">C</span>
          <span class="orig">原 D</span>
          <div class="stepper">
            <button aria-label="降半音">−</button>
            <span class="val">−2</span>
            <button aria-label="升半音">+</button>
          </div>
        </div>
      </div>

      <span class="sec">Verse 1</span>
      <p class="plain">我們高舉耶穌的名</p>
      <div class="chord-line">
        <span class="ch">C</span><span class="tx">高舉</span>
        <span class="ch">G</span><span class="tx">全能</span>
        <span class="ch">Am</span><span class="tx">君王</span>
      </div>
      <div class="chord-line">
        <span class="ch">F</span><span class="tx">祢配得一切讚美</span>
      </div>

      <span class="sec">Chorus</span>
      <div class="chord-line">
        <span class="ch">C</span><span class="tx">耶穌</span>
        <span class="ch">G</span><span class="tx">祢的名</span>
        <span class="ch">Am</span><span class="tx">何等</span>
        <span class="ch">F</span><span class="tx">甜美</span>
      </div>
      <div class="chord-line">
        <span class="ch">C</span><span class="tx">超過一切</span>
        <span class="ch">G</span><span class="tx">名號</span>
      </div>

      <span class="sec">Bridge</span>
      <p class="plain">萬膝要跪拜　萬口要承認</p>
      <div class="chord-line">
        <span class="ch">Am</span><span class="tx">萬膝</span>
        <span class="ch">F</span><span class="tx">要跪拜</span>
        <span class="ch">C</span><span class="tx">萬口</span>
        <span class="ch">G</span><span class="tx">要承認</span>
      </div>
    </div>
  </section>

  <aside class="rail">
    <div class="panel">
      <div class="hd"><span>flow</span><span>04</span></div>
      <div class="chips">
        <span class="chip" style="flex:0 0 auto">V1</span>
        <span class="chip now" style="flex:0 0 auto">C</span>
        <span class="chip" style="flex:0 0 auto">C</span>
        <span class="chip" style="flex:0 0 auto">BR</span>
      </div>
    </div>

    <div class="panel">
      <div class="hd"><span>dynamic</span><span>7/10</span></div>
      <div class="meter"><i style="width:70%"></i></div>
    </div>

    <div class="panel">
      <div class="kv"><span>SPEED</span><span>72 bpm</span></div>
      <div class="kv"><span>METER</span><span>4/4</span></div>
      <div class="kv"><span>NEXT</span><span>Pad 鋪底</span></div>
    </div>

    <div class="note">注意：第二次副歌收細聲。</div>
  </aside>

</main>

<footer class="bottom">
  <button class="arrow" aria-label="上一首">‹</button>
  <div class="now">
    <p class="t"><span>我們高舉耶穌的名</span><span class="k">C</span></p>
    <p class="s">01 / 03 · 注意：第二次副歌收細聲</p>
  </div>
  <button class="arrow" aria-label="下一首">›</button>
  <div class="tools">
    <button class="tool">和弦</button>
    <button class="tool">全螢幕</button>
    <button class="tool">深色</button>
  </div>
</footer>

</body>
</html>

<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舞台模式 · Stable Audio 風格預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --amber-pulse:#f9a916;
  --lime-signal:#a0f32f;
  --lavender-wash:#c4bae3;
  --mustard-field:#e1ca46;
  --sage-mist:#9fc2c7;
  --khaki-paper:#e5dfc8;
  --warm-canvas:#f4f1ec;
  --pure-paper:#ffffff;
  --pale-mist:#e2e2e7;
  --hairline:#d2d1db;
  --ink-stone:#27262b;
  --charcoal:#000000;
  --ash:#737170;
  --font-inter:'Inter',ui-sans-serif,system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  --radius-card:4px;
  --radius-pill:9999px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;display:flex;flex-direction:column;
  background:var(--warm-canvas);color:var(--charcoal);
  font-family:var(--font-inter);font-size:16px;line-height:1.5;letter-spacing:-0.1px;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}

/* ---------- stage top bar ---------- */
.top{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:12px 20px;flex:none;
}
.top .left{display:flex;align-items:center;gap:10px;min-width:0;}
/* sun mark */
.sun{width:22px;height:22px;border-radius:50%;background:var(--amber-pulse);flex:none;position:relative;}
.sun::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--charcoal);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);opacity:.25;}
.top .meta{font-size:13px;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.09px;}
.top .actions{display:flex;gap:8px;flex:none;}

.pill{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:var(--radius-pill);font-family:var(--font-inter);font-weight:700;
  cursor:pointer;border:1px solid transparent;white-space:nowrap;
  transition:transform .12s ease;
}
.pill:active{transform:scale(.97);}
.pill-amber{background:var(--amber-pulse);color:var(--charcoal);padding:10px 20px;font-size:14px;}
.pill-ghost{background:var(--pure-paper);border-color:var(--charcoal);color:var(--charcoal);padding:8px 16px;font-size:13px;}
.pill-dark{background:var(--ink-stone);color:var(--pure-paper);padding:6px 14px;font-size:12px;}
.icon-pill{
  width:36px;height:36px;padding:0;background:var(--pure-paper);
  border:1px solid var(--hairline);color:var(--ink-stone);
  border-radius:var(--radius-pill);display:grid;place-items:center;cursor:pointer;
}
.icon-pill:hover{border-color:var(--charcoal);}

/* ---------- main stage area ---------- */
.stage{
  flex:1;min-height:0;display:flex;gap:0;overflow:hidden;
}

/* lyrics card — the content the team actually reads */
.lyrics-wrap{
  flex:1;min-width:0;padding:0 20px 16px;
  overflow-y:auto;
  display:flex;flex-direction:column;
  /* height:100% resolves against .stage (a flex item with a definite height),
     so the card can grow to fill it. Without this the wrapper sized to the
     card's content and the card simply stopped mid-screen. */
  height:100%;
}
.lyrics-card{
  background:var(--pure-paper);
  border-radius:var(--radius-card);
  padding:28px 32px 40px;
  max-width:820px;margin:0 auto;
  width:100%;
  /* Grow to fill the stage height so a short song doesn't leave the screen
     looking half-empty mid-set. flex-grow needs a definite parent height. */
  flex:1 0 auto;
  min-height:100%;
}
@media(max-width:640px){
  .lyrics-wrap{padding:0 12px 12px;}
  .lyrics-card{padding:20px 18px 32px;}
}

.song-head{
  display:flex;align-items:center;gap:12px;
  padding-bottom:16px;margin-bottom:20px;
  border-bottom:1px solid var(--hairline);
}
.song-head h1{
  margin:0;flex:1;min-width:0;
  font-size:20px;line-height:1.5;font-weight:700;letter-spacing:-0.3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
@media(min-width:900px){
  .song-head h1{font-size:30px;line-height:1.33;letter-spacing:-0.51px;}
}

/* key group — pill, beside the title */
.keygroup{display:flex;align-items:center;gap:6px;flex:none;}
.key-pill{
  background:var(--lime-signal);color:var(--charcoal);
  font-weight:700;font-size:14px;letter-spacing:-0.09px;
  padding:4px 12px;border-radius:var(--radius-pill);
  font-variant-numeric:tabular-nums;
}
.key-orig{font-size:12px;color:var(--ash);font-weight:400;letter-spacing:-0.07px;}

/* transpose stepper — pills, per the radius rule */
.stepper{display:flex;align-items:center;border:1px solid var(--charcoal);border-radius:var(--radius-pill);overflow:hidden;}
.stepper button{
  width:30px;height:30px;border:0;background:none;color:var(--charcoal);
  font-size:15px;font-weight:700;cursor:pointer;line-height:1;
}
.stepper button:hover{background:var(--khaki-paper);}
.stepper .val{
  min-width:26px;text-align:center;font-size:12px;font-weight:700;
  letter-spacing:-0.07px;font-variant-numeric:tabular-nums;
}

/* ---------- lyric body ---------- */
.section-chip{
  display:inline-block;margin:20px 0 8px;
  background:var(--ink-stone);color:var(--pure-paper);
  border-radius:var(--radius-pill);
  padding:3px 12px;font-size:12px;font-weight:700;letter-spacing:-0.07px;
}
.section-chip:first-child{margin-top:0;}
.verse{margin:0 0 4px;}
.chord-line{
  display:flex;flex-wrap:wrap;align-items:flex-end;
  font-size:16px;line-height:1.65;letter-spacing:-0.1px;
}
.chord-line .ch{
  color:var(--ash);font-weight:700;font-size:14px;
  letter-spacing:-0.09px;margin-right:2px;
}
.chord-line .tx{padding-right:2px;}
.lyric-plain{
  margin:0;font-size:16px;line-height:1.78;letter-spacing:-0.1px;color:var(--charcoal);
}
.lyric-highlight{background:var(--khaki-paper);border-radius:2px;padding:0 2px;}

/* ---------- desktop metrics rail ---------- */
.rail{
  width:264px;flex:none;background:var(--khaki-paper);
  border-radius:var(--radius-card) var(--radius-card) 0 0;
  margin:0 12px 16px 0;padding:20px;
  display:flex;flex-direction:column;gap:16px;overflow-y:auto;
}
@media(max-width:900px){.rail{display:none;}}
.rail h3{margin:0;font-size:12px;font-weight:700;letter-spacing:-0.07px;text-transform:uppercase;color:var(--ash);}
.rail .flow{display:flex;flex-wrap:wrap;gap:6px;}
.rail .chip{border:1px solid var(--charcoal);border-radius:var(--radius-pill);padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:-0.07px;}
.rail .chip.now{background:var(--ink-stone);color:var(--pure-paper);border-color:var(--ink-stone);}
.rail .kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;letter-spacing:-0.09px;}
.rail .kv span:first-child{color:var(--ash);}
.rail .kv span:last-child{font-weight:700;}
.rail .note{
  margin-top:auto;background:var(--pure-paper);border-radius:var(--radius-card);
  padding:12px;font-size:13px;line-height:1.5;letter-spacing:-0.09px;color:var(--ink-stone);
}
/* dynamic bar: lime is audio-active, so it marks the dynamic level */
.dyn{height:6px;border-radius:var(--radius-pill);background:var(--pale-mist);overflow:hidden;}
.dyn i{display:block;height:100%;background:var(--lime-signal);border-radius:var(--radius-pill);}

/* ---------- bottom bar ---------- */
.bottom{
  flex:none;display:flex;align-items:center;gap:6px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--warm-canvas);
  border-top:1px solid var(--hairline);
}
.navbtn{
  width:48px;height:44px;flex:none;display:grid;place-items:center;
  background:var(--pure-paper);border:1px solid var(--hairline);
  border-radius:var(--radius-pill);color:var(--charcoal);cursor:pointer;font-size:18px;
}
.navbtn:disabled{opacity:.35;cursor:default;}
.nowbar{flex:1;min-width:0;text-align:center;}
.nowbar .t{
  margin:0;font-size:14px;font-weight:700;letter-spacing:-0.09px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.nowbar .t .k{
  background:var(--lime-signal);color:var(--charcoal);
  border-radius:var(--radius-pill);padding:1px 8px;font-size:11px;font-weight:700;flex:none;
}
.nowbar .s{margin:2px 0 0;font-size:11px;color:var(--ash);letter-spacing:-0.07px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ctrls{display:flex;gap:6px;flex:none;}

@media(max-width:640px){
  .top{padding:10px 12px;}
  .top .meta{display:none;}
  .pill-amber{padding:8px 14px;font-size:12px;}
  .bottom{padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:4px;}
  .navbtn{width:42px;height:44px;}
  .ctrls .icon-pill{width:34px;height:34px;}
}
</style>
</head>
<body>

<header class="top">
  <div class="left">
    <span class="sun"></span>
    <span class="meta">20261114 青少年聚會 · 3 首</span>
  </div>
  <div class="actions">
    <button class="icon-pill" aria-label="詩歌順序">☰</button>
    <button class="pill pill-amber">結束舞台模式</button>
  </div>
</header>

<main class="stage">

  <div class="lyrics-wrap">
    <article class="lyrics-card">

      <div class="song-head">
        <h1>我們高舉耶穌的名</h1>
        <div class="keygroup">
          <span class="key-pill">C</span>
          <span class="key-orig">原 D</span>
          <div class="stepper">
            <button aria-label="降半音">−</button>
            <span class="val">−2</span>
            <button aria-label="升半音">+</button>
          </div>
        </div>
      </div>

      <span class="section-chip">Verse 1</span>
      <p class="verse"><span class="lyric-plain">我們高舉耶穌的名</span></p>
      <div class="chord-line">
        <span class="ch">C</span><span class="tx">高舉</span>
        <span class="ch">G</span><span class="tx">全能</span>
        <span class="ch">Am</span><span class="tx">君王</span>
      </div>
      <div class="chord-line">
        <span class="ch">F</span><span class="tx">祢配得一切讚美</span>
      </div>

      <span class="section-chip">Chorus</span>
      <div class="chord-line">
        <span class="ch">C</span><span class="tx">耶穌</span>
        <span class="ch">G</span><span class="tx">祢的名</span>
        <span class="ch">Am</span><span class="tx">何等</span>
        <span class="ch">F</span><span class="tx">甜美</span>
      </div>
      <div class="chord-line">
        <span class="ch">C</span><span class="tx">超過一切</span>
        <span class="ch">G</span><span class="tx">名號</span>
      </div>

      <span class="section-chip">Bridge</span>
      <p class="verse"><span class="lyric-plain">萬膝要跪拜　萬口要承認</span></p>
      <div class="chord-line">
        <span class="ch">Am</span><span class="tx">萬膝</span>
        <span class="ch">F</span><span class="tx">要跪拜</span>
        <span class="ch">C</span><span class="tx">萬口</span>
        <span class="ch">G</span><span class="tx">要承認</span>
      </div>

    </article>
  </div>

  <aside class="rail">
    <div>
      <h3>段落 Flow</h3>
      <div class="flow" style="margin-top:8px;">
        <span class="chip">V1</span>
        <span class="chip now">C</span>
        <span class="chip">C</span>
        <span class="chip">Bridge</span>
      </div>
    </div>

    <div>
      <h3>動態 7 / 10</h3>
      <div class="dyn" style="margin-top:8px;"><i style="width:70%"></i></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div class="kv"><span>速度</span><span>72 bpm</span></div>
      <div class="kv"><span>拍號</span><span>4/4</span></div>
      <div class="kv"><span>接</span><span>Pad 鋪底</span></div>
    </div>

    <div class="note">注意：第二次副歌收細聲。</div>
  </aside>

</main>

<footer class="bottom">
  <button class="navbtn" aria-label="上一首">‹</button>

  <div class="nowbar">
    <p class="t"><span>我們高舉耶穌的名</span><span class="k">C</span></p>
    <p class="s">1 / 3 · 注意：第二次副歌收細聲</p>
  </div>

  <button class="navbtn" aria-label="下一首">›</button>

  <div class="ctrls">
    <button class="icon-pill" aria-label="切換和弦" title="隱藏和弦">👁</button>
    <button class="icon-pill" aria-label="全螢幕" title="全螢幕">⤢</button>
  </div>
</footer>

</body>
</html>

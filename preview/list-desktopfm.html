<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>敬拜清單 · Desktop.fm 風格預覽</title>
<style>
:root{
  --canvas-mist:#f1f2f3;
  --carbon-black:#111111;
  --pure-white:#ffffff;
  --graphite:#2d2d2d;
  --pale-stone:#dddddd;
  --silver-mist:#b4b4b4;

  /* System stack only — no webfont. The mechanical feel comes from the OS face
     at weights 700/800, which is exactly what the reference relies on. */
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,"PingFang TC","Noto Sans TC",sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;

  --r-card:25px;
  --r-btn:20px;
  --r-win:13px;
  --r-flat:1.5px;

  --shadow-window: 0 1px 3px rgba(17,17,17,.08), 0 4px 12px rgba(17,17,17,.06);
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--canvas-mist);color:var(--carbon-black);
  font-family:var(--font);line-height:1.25;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}

/* ---------- page: centered, unconstrained ---------- */
.page{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:40px 20px 60px;
}

/* ---------- the single elevated card, macOS window ---------- */
.window{
  width:100%;max-width:520px;
  background:var(--pure-white);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-window);
  overflow:hidden;
}
/* title bar: traffic lights + hairline */
.titlebar{
  display:flex;align-items:center;gap:6px;
  padding:10px 12px;
  border-bottom:2px solid var(--pale-stone);
}
.dot{width:6px;height:6px;border-radius:var(--r-flat);background:var(--silver-mist);}
.dot.mid,.dot.last{background:var(--graphite);}
.titlebar .name{
  margin-left:auto;font-family:var(--mono);
  font-size:12px;font-weight:800;letter-spacing:0;color:var(--silver-mist);
}
.body{padding:20px;}

/* brand wordmark — the only headline-scale element */
h1.wordmark{
  margin:0;
  font-size:28px;font-weight:800;line-height:1.25;letter-spacing:-1.008px;
  text-align:center;
}
.sub{
  margin:8px 0 0;text-align:center;
  font-size:16px;font-weight:500;letter-spacing:-0.256px;color:var(--graphite);
}

/* the sole filled CTA */
.cta{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  background:var(--carbon-black);color:var(--pure-white);
  border:0;border-radius:var(--r-btn);
  padding:10px 20px;
  font-family:var(--font);font-size:12px;font-weight:800;letter-spacing:0;
  cursor:pointer;white-space:nowrap;
}
.cta .chev{font-size:12px;font-weight:800;line-height:1;}
.cta-wrap{display:flex;justify-content:center;margin-top:20px;}

/* ---------- meta rows, inside the window ---------- */
.rows{margin-top:20px;border-top:2px solid var(--pale-stone);}
.row{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:10px 0;border-bottom:1.5px solid var(--pale-stone);
}
.row:last-child{border-bottom:0;}
.row dt{font-size:12px;font-weight:500;color:var(--silver-mist);letter-spacing:0;text-transform:uppercase;}
.row dd{margin:0;font-size:16px;font-weight:700;letter-spacing:-0.256px;text-align:right;}
.desc{
  margin:16px 0 0;font-size:16px;font-weight:500;line-height:1.25;
  letter-spacing:-0.256px;color:var(--graphite);
}

/* ---------- song list ---------- */
.list-head{
  width:100%;max-width:520px;
  display:flex;align-items:baseline;justify-content:space-between;
  margin:30px 0 10px;
}
.list-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-0.288px;}
.list-head span{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--silver-mist);}

.songs{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;}

.song{
  background:var(--pure-white);
  border-radius:var(--r-flat);
  padding:10px 12px;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  box-shadow:var(--shadow-window);
}
/* sequence reads as a stamped serial number */
.seq{
  font-family:var(--mono);font-size:12px;font-weight:800;
  color:var(--carbon-black);width:20px;
}
.song-t{min-width:0;}
.song-t .t{
  margin:0;font-size:16px;font-weight:700;letter-spacing:-0.256px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.song-t .m{
  margin:2px 0 0;font-size:12px;font-weight:500;color:var(--silver-mist);
}
.song-a{display:flex;align-items:center;gap:8px;flex:none;}
/* live marker — the only chromatic note, and it is muted to fit the system */
.live{
  font-family:var(--mono);font-size:12px;font-weight:800;
  background:var(--carbon-black);color:var(--pure-white);
  border-radius:var(--r-flat);padding:2px 6px;letter-spacing:0;
}
/* Outlined, not filled: the system allows exactly one black filled CTA per
   page, and that is 開啟舞台模式. These are secondary actions. */
.tiny-btn{
  background:transparent;color:var(--graphite);
  border:1.5px solid var(--pale-stone);
  border-radius:var(--r-btn);padding:6px 12px;
  font-family:var(--font);font-size:12px;font-weight:800;cursor:pointer;
}
.tiny-btn:hover{border-color:var(--graphite);color:var(--carbon-black);}

/* transition between songs — a hairline with a stamped label */
.between{
  display:flex;align-items:center;gap:8px;padding:0 4px;
}
.between .l{flex:1;height:1.5px;background:var(--pale-stone);}
.between .t{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--silver-mist);}

/* ---------- footer controls ---------- */
.foot{
  width:100%;max-width:520px;display:flex;gap:8px;margin-top:30px;flex-wrap:wrap;
}
.ghost{
  background:transparent;border:1.5px solid var(--pale-stone);
  color:var(--graphite);border-radius:var(--r-btn);padding:8px 16px;
  font-family:var(--font);font-size:12px;font-weight:800;cursor:pointer;
}
.ghost:hover{border-color:var(--graphite);}

@media(max-width:560px){
  .page{padding:24px 14px 40px;}
  h1.wordmark{font-size:24px;letter-spacing:-0.8px;}
}
</style>
</head>
<body>

<div class="page">

  <!-- the one elevated container -->
  <section class="window">
    <div class="titlebar">
      <span class="dot"></span>
      <span class="dot mid"></span>
      <span class="dot last"></span>
      <span class="name">worship-list</span>
    </div>

    <div class="body">
      <h1 class="wordmark">20261114 青少年聚會</h1>
      <p class="sub">一同敬拜 · 同步睇譜</p>

      <div class="cta-wrap">
        <button class="cta">開啟舞台模式 <span class="chev">›</span></button>
      </div>

      <dl class="rows">
        <div class="row"><dt>日期</dt><dd>2026.11.14（六）</dd></div>
        <div class="row"><dt>主領</dt><dd>西瓜、信恩</dd></div>
        <div class="row"><dt>詩歌</dt><dd>3 首</dd></div>
      </dl>

      <p class="desc">本週主題：成為祝福。會前 30 分鐘集合練歌，請自備耳機及水。</p>
    </div>
  </section>

  <div class="list-head">
    <h2>曲目</h2>
    <span>03 TRACKS</span>
  </div>

  <ol class="songs">
    <li class="song">
      <span class="seq">01</span>
      <div class="song-t">
        <p class="t">我們高舉耶穌的名</p>
        <p class="m">C KEY · 72 BPM</p>
      </div>
      <div class="song-a">
        <span class="live">LIVE</span>
        <button class="tiny-btn">推送</button>
      </div>
    </li>

    <li class="between"><span class="l"></span><span class="t">PAD 鋪底</span><span class="l"></span></li>

    <li class="song">
      <span class="seq">02</span>
      <div class="song-t">
        <p class="t">從心合一</p>
        <p class="m">G KEY · 68 BPM</p>
      </div>
      <div class="song-a">
        <button class="tiny-btn">推送</button>
      </div>
    </li>

    <li class="between"><span class="l"></span><span class="t">無縫接歌</span><span class="l"></span></li>

    <li class="song">
      <span class="seq">03</span>
      <div class="song-t">
        <p class="t">大山為我挪開</p>
        <p class="m">D KEY · 76 BPM</p>
      </div>
      <div class="song-a">
        <button class="tiny-btn">推送</button>
      </div>
    </li>
  </ol>

  <div class="foot">
    <button class="ghost">編輯清單資料</button>
    <button class="ghost">分享清單</button>
  </div>

</div>

</body>
</html>

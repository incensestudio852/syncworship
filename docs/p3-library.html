<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>上傳詩歌庫</title>
<link rel="stylesheet" href="base.css" />
</head>
<body>

<div class="mast">
  <span class="mark">Sync Worship</span>
  <span class="tag">一同敬拜 · 同步睇譜</span>
  <span class="page">詩歌庫</span>
</div>

<h1>上傳<b>詩歌庫</b>，日後都找得到</h1>
<p class="lead">樂譜可以是 PDF，也可以是手機拍下的相片。上傳後自動辨識歌詞與和弦，日後用一個欄位就能找回。</p>

<div class="split">
  <div>
    <div class="shotcap"><span class="pill">詩歌庫</span>上傳、搜尋、篩選</div>
    <div class="phone">
      <div class="shot">
        <img src="../s2_library.png" alt="詩歌庫" />
        <span class="pin" style="left:70.7%; top:13.6%">F</span>
        <span class="pin" style="left:49.6%; top:22.0%">G</span>
        <span class="pin" style="left:17.1%; top:28.7%">H</span>
      </div>
    </div>
  </div>

  <div>
    <div class="points">
      <div class="pt"><span class="k">F</span>
        <div><b>新增詩歌</b>
          <p>拍照或上傳即可，系統自動辨識歌詞與和弦。(BETA) 可一次選擇多個檔案，會合併成同一首歌的頁面。
          辨識語言提供繁中、簡中、English 等六種。</p></div></div>

      <div class="pt"><span class="k">G</span>
        <div><b>一個欄位搜齊</b>
          <p>歌名、歌詞、標籤皆可搜尋。輸入幾個字即時顯示，命中的字詞會標亮，即使記不清歌名也能找回。</p></div></div>

      <div class="pt"><span class="k">H</span>
        <div><b>標籤篩選</b>
          <p>以「敬拜」「聖餐」等標籤快速收窄範圍。</p></div></div>
    </div>

  </div>
</div>

</body>
</html>

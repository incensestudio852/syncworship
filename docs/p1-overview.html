<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>Sync Worship 總覽</title>
<link rel="stylesheet" href="base.css" />
<style>
  .hero{display:grid; grid-template-columns:1fr 430px; gap:56px; margin-top:34px; align-items:start;}
  .flow{display:flex; gap:10px; align-items:stretch;}
  .step{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px 24px;}
  .step .n{font-size:14px; font-weight:700; color:var(--gold); letter-spacing:.1em;}
  .step b{display:block; font-size:25px; margin:9px 0 10px;}
  .step p{font-size:18.5px; color:var(--muted); line-height:1.62;}
  .arw{display:grid; place-items:center; color:var(--gold); font-size:22px; flex:none;}
  .pages{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:40px;}
  .pg{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:34px 26px;
     display:flex; flex-direction:column; justify-content:flex-start;}
  .pg span{font-size:13px; font-weight:700; color:var(--gold); letter-spacing:.1em;}
  .pg b{display:block; font-size:23px; margin:7px 0 6px;}
  .pg p{font-size:17.5px; color:var(--muted); line-height:1.72;}

  .phone{position:relative; border-radius:24px; overflow:hidden; background:#fff;
         height:600px;
         border:8px solid #1b1b1e; box-shadow:0 16px 40px rgba(20,30,50,.15);}
  .phone img{display:block; width:100%; height:100%; object-fit:cover; object-position:top;}
</style>
</head>
<body>

<div class="mast">
  <span class="mark">Sync Worship</span>
  <span class="tag">一同敬拜 · 同步睇譜</span>
</div>

<h1>一部手機推歌，<br />全隊立即<b>看到同一頁</b>。</h1>
<p class="lead">
  敬拜隊共用一個帳號，不必逐部裝置登入。誰推送哪一首歌，其他人的畫面就跟著跳轉，
  台上台下看的永遠是同一份譜。
</p>

<div class="hero">
  <div>
    <div class="flow">
      <div class="step">
        <div class="n">第一步</div>
        <b>排好清單</b>
        <p>從詩歌庫挑歌，拖動即可調整次序。</p>
      </div>
      <div class="arw">›</div>
      <div class="step">
        <div class="n">第二步</div>
        <b>按一下推送</b>
        <p>全隊同時收到，不必再逐個傳送檔案。</p>
      </div>
      <div class="arw">›</div>
      <div class="step">
        <div class="n">第三步</div>
        <b>一同敬拜</b>
        <p>樂譜、歌詞、和弦都在同一個畫面。</p>
      </div>
    </div>

    <div class="pages" style="margin-top:44px">
      <div class="pg"><span>02</span><b>敬拜清單</b><p>排歌、轉 Key、推送上台</p></div>
      <div class="pg"><span>03</span><b>詩歌庫</b><p>上傳樂譜，一個欄位搜齊</p></div>
      <div class="pg"><span>04</span><b>舞台模式</b><p>全螢幕閱譜。即使聚會場地接收不到訊號，仍可離線查看曾經開啟的樂譜。</p></div>
    </div>
  </div>

  <div>
    <div class="shotcap"><span class="pill">舞台模式</span>即時同步睇譜</div>
    <div class="phone">
      <img src="../s3_stage.png" alt="舞台模式" />
    </div>
  </div>
</div>

</body>
</html>
